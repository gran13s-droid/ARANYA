<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ARANYA</title>
    <link rel="icon" href="data:," />
    <style>
      /* Colors are injected from art/palette/aranya-15.gpl at startup (client/src/main.ts). */
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--c-forest-deep, #000); }
      #game { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #status, #hud { font: 14px/1.4 'Noto Sans Thai Looped', system-ui, sans-serif; color: var(--c-cream); }
      #status { position: fixed; left: 12px; top: 10px; padding: 4px 10px; border-radius: 4px; background: rgba(20, 27, 26, 0.7); pointer-events: none; }
      #hud { position: fixed; left: 0; right: 0; bottom: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
      .hud-bars { display: flex; gap: 16px; }
      .hud-bar { display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 4px; background: rgba(20, 27, 26, 0.75); }
      .hud-bar-track { width: 160px; height: 8px; background: var(--c-ink); border: 1px solid var(--c-stone); }
      .hud-bar-fill { height: 100%; width: 0; }
      .hud-bar-hp .hud-bar-fill { background: var(--c-fire); }
      .hud-bar-res .hud-bar-fill { background: var(--c-gold); }
      .hud-bar-text { min-width: 64px; font-size: 12px; }
      .hud-hotbar { display: flex; gap: 6px; }
      .hud-slot { position: relative; width: 64px; height: 56px; overflow: hidden; border: 2px solid var(--c-stone); border-radius: 6px; background: rgba(20, 27, 26, 0.85); }
      .hud-slot.ready { border-color: var(--c-gold); }
      .hud-slot.rejected { animation: hud-reject 0.3s; }
      @keyframes hud-reject { 0%, 100% { border-color: var(--c-stone); } 50% { border-color: var(--c-fire); } }
      .hud-slot-name { position: absolute; left: 3px; right: 3px; top: 3px; font-size: 10px; line-height: 1.15; text-align: center; }
      .hud-slot-key { position: absolute; right: 4px; bottom: 2px; font-size: 12px; color: var(--c-gold); }
      .hud-slot-shade { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(20, 27, 26, 0.75); }
      .hud-dead { display: none; padding: 6px 14px; border-radius: 4px; background: rgba(20, 27, 26, 0.85); color: var(--c-fire); }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="status"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
