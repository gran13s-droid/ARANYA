<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ARANYA</title>
    <link rel="icon" href="data:," />
    <style>
      /* Colors are injected from art/palette/aranya-15.gpl at startup (client/src/main.ts). */
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--c-forest-deep, #000); }
      #game { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #status { position: fixed; left: 12px; bottom: 8px; padding: 2px 8px; border-radius: 4px; background: rgba(20, 27, 26, 0.7); pointer-events: none; font: 12px/1.4 'Noto Sans Thai Looped', system-ui, sans-serif; color: var(--c-cream); }
      /* Pixel UI (client/src/ui/hud.ts): every size is a multiple of --u = CSS px per 640x360 UI pixel (Art Bible 9.1). */
      .ui-root { --u: 2px; --shade: color-mix(in srgb, var(--c-ink) 60%, transparent); position: fixed; inset: 0; pointer-events: none; color: var(--c-cream); font-family: 'Noto Sans Thai Looped', system-ui, sans-serif; }
      .ui-root div, .ui-root span, .ui-root img, .ui-root canvas { position: absolute; }
      .ui-px { image-rendering: pixelated; display: block; }
      .ui-player, .ui-target { pointer-events: none; }
      .ui-hotbar { bottom: calc(var(--u) * 4); height: calc(var(--u) * 45); }
      .ui-shade { border-radius: 50%; }
      .ui-text { white-space: nowrap; line-height: 1; text-shadow: 1px 0 var(--c-ink), -1px 0 var(--c-ink), 0 1px var(--c-ink), 0 -1px var(--c-ink); }
      .ui-small { font-size: calc(var(--u) * 6.5); }
      .ui-name { font: calc(var(--u) * 8) 'Chonburi', 'Noto Sans Thai Looped', serif; color: var(--c-cream); }
      .ui-bar-label { display: flex; align-items: center; font-size: calc(var(--u) * 6.5); }
      .ui-slot-label { display: flex; justify-content: center; align-items: center; }
      .ui-target { display: none; }
      .ui-dead { display: none; left: 0; right: 0; bottom: calc(var(--u) * 60); text-align: center; color: var(--c-fire); font-size: calc(var(--u) * 9); }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="status"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
